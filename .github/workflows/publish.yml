# Release: merging a version bump to main publishes it.
#
# A push to main whose pyproject version has no v<version> tag yet is a release: test,
# build, check the changelog and Homebrew formula against the build, publish to PyPI, then
# tag the commit and create the GitHub release from the changelog section. Prepare the
# bump with `python scripts/release.py prepare patch|minor|major|X.Y.Z`.
#
# The filename is load-bearing: PyPI's trusted publisher for ace-sidecar is bound to
# publish.yml, so renaming it breaks the OIDC upload.
name: Release

on:
  push:
    branches: [main]
    paths: [pyproject.toml]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: v
        run: |
          version=$(python scripts/release.py version)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Releases come from main only; this run is on $GITHUB_REF."
            echo "release=false" >> "$GITHUB_OUTPUT"
          elif git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "v$version is already tagged; nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: detect
    if: needs.detect.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install build twine
          pip install -e ".[test]"
      - name: Test
        run: pytest
        env:
          PYTHONPATH: src
      - name: Build wheel and sdist
        run: python -m build
      - name: Check metadata
        run: twine check dist/*
      - name: Changelog and Homebrew formula match the build
        run: |
          v=${{ needs.detect.outputs.version }}
          test -f "dist/ace_sidecar-$v.tar.gz" && test -f "dist/ace_sidecar-$v-py3-none-any.whl"
          python scripts/release.py check --sdist "dist/ace_sidecar-$v.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  pypi:
    needs: [detect, build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write # PyPI trusted publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # A rerun after a later step failed must not fail on the files already uploaded.
          skip-existing: true

  github-release:
    needs: [detect, pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Tag and create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=${{ needs.detect.outputs.version }}
          python scripts/release.py notes "$v" > notes.md
          gh release create "v$v" dist/* \
            --target "$GITHUB_SHA" \
            --title "v$v" \
            --notes-file notes.md
