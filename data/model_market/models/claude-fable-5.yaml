# Axis 1. Every score below is basis:operator-ranking - derived from WHERE the operator's
# 2026-07 shortlist placed this model, NOT from a benchmark score we hold. 0.95 = listed
# as a top performer for that segment; 0.88 = listed as the cheap/cost-effective pick.
# Categories the shortlist says nothing about are OMITTED rather than invented.
