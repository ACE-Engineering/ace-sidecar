  reasoning:  {score: 0.95, basis: operator-ranking, boards: [gpqa-diamond, lmsys-hard-prompts, hle], as_of: "2026-07-21", source: ""}
  qa:         {score: 0.95, basis: operator-ranking, boards: [mmlu-pro, lmsys-arena-elo], as_of: "2026-07-21", source: ""}
  vision:     {score: 0.95, basis: operator-ranking, boards: [osworld, browsecomp], as_of: "2026-07-21", source: ""}
  chat:       {score: 0.90, basis: assumed, as_of: "2026-07-21", source: ""}

profiles:
  agentic:  {basis: assumed, boards: [tau3-bench, osworld]}

offerings:
