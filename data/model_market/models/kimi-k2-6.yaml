modalities: [text]
confidence: asserted        # capability is operator-authored, not evaluated — see notes

# Moonshot Kimi K2.6 as served on Azure AI Foundry — the middle rung of the demo ladder and
# the one that makes the demo interesting: at $0.95/$4.00 against gpt-5's $1.25/$10.00 it
# wins the HIGH intelligence tier on cost while staying capable enough to serve it. A
# high-complexity demo prompt routes here, which is the router escalating *and* saving in
# the same decision.
#
# `id` carries the exact casing the Azure resource serves ("Kimi-K2.6"), because that string
# has to match the fleet's model name for the local candidate filter to hit it. Distinct
# from the kimi-k3 catalog entry, which is a different, later model.

