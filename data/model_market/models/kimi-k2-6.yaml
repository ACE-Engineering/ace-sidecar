offerings:
  # Azure AI Foundry lists a $0.16/1M CACHED-input rate as well. Deliberately not encoded:
  # this is a prompt:completion table, and a provider-side prefix-cache discount is not what
  # ACE's semantic cache does — a HIT is served from ACE's own store at zero upstream cost.
  # Folding it in would understate the real per-token price on every uncached request. Same
  # reasoning as the ACE_PRICE_TABLE comment in environments/demo/config.env.
  - provider: azure
    pricing: {kind: per_token, in: 0.95, out: 4.0, unit: usd_per_1m}
    context: 256000
    regions: [us-east]
    as_of: "2026-07-26"
    source: "https://azure.microsoft.com/pricing/details/cognitive-services/openai-service/"

provenance: operator-supplied
notes: >-
  Price is the vendor list rate the demo is billed at; capability is operator-authored and
  UNVERIFIED (design section 11, weakness 1).

